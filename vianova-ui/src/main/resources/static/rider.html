<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vianova</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .mode-toggle { display: none; }
        #driverView { display: none !important; }
    </style>
</head>
<body>
<div id="app-root"></div>
<div id="chatbot-root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="/js/modules/shared-components.js"></script>
<script src="/js/modules/chatbot-components.js"></script>
<script src="/js/modules/rider-components.js"></script>
<script src="/js/modules/driver-components.js"></script>
<script src="/js/modules/app-shell.js"></script>
<script src="/js/react-shell.js"></script>
<script>
    window.VianovaChatContext = {
        page: "rider",
        userType: "",
        userId: ""
    };
    window.VianovaReactShell.mount("rider");
    window.VianovaUiModules.chatbot.mount();
</script>

<script>
    function syncChatContext(page, userType, userId) {
        window.VianovaChatContext = {
            page: page,
            userType: userType || "",
            userId: userId || ""
        };
        try {
            window.sessionStorage.setItem("vianova-chat-context", JSON.stringify(window.VianovaChatContext));
        } catch (_) {
        }
        window.dispatchEvent(new CustomEvent("vianova-chat-context-changed", { detail: window.VianovaChatContext }));
    }

    syncChatContext("rider", "", "");

    const riderBtn = document.getElementById("riderBtn");
    const driverBtn = document.getElementById("driverBtn");
    const riderView = document.getElementById("riderView");
    const driverView = document.getElementById("driverView");

    function setMode(mode) {
        const rider = mode === "rider";
        riderBtn.classList.toggle("active", rider);
        driverBtn.classList.toggle("active", !rider);
        riderView.classList.toggle("hidden", !rider);
        driverView.classList.toggle("hidden", rider);
    }

    riderBtn.addEventListener("click", () => setMode("rider"));
    driverBtn.addEventListener("click", () => setMode("driver"));

    const riderLoginForm = document.getElementById("riderLoginForm");
    const riderAuthCard = document.getElementById("riderAuthCard");
    const showRiderOnboardingBtn = document.getElementById("showRiderOnboardingBtn");
    const riderOnboardingWrap = document.getElementById("riderOnboardingWrap");
    const riderOnboardingForm = document.getElementById("riderOnboardingForm");
    const riderOnboardingMessage = document.getElementById("riderOnboardingMessage");
    const riderActions = document.getElementById("riderActions");
    const riderProfileBtn = document.getElementById("riderProfileBtn");
    const riderProfilePanel = document.getElementById("riderProfilePanel");
    const riderAddressList = document.getElementById("riderAddressList");
    const riderAddressForm = document.getElementById("riderAddressForm");
    const riderPaymentList = document.getElementById("riderPaymentList");
    const riderPaymentForm = document.getElementById("riderPaymentForm");
    const riderSavedCardsList = document.getElementById("riderSavedCardsList");
    const riderCardForm = document.getElementById("riderCardForm");
    const riderProfileMessage = document.getElementById("riderProfileMessage");
    const riderLogoutBtn = document.getElementById("riderLogoutBtn");
    const riderLoginMessage = document.getElementById("riderLoginMessage");
    const riderForm = document.getElementById("riderForm");
    const riderHint = document.getElementById("riderHint");
    const estimate = document.getElementById("estimate");
    const drivers = document.getElementById("drivers");
    const riderOptionsBlock = document.getElementById("riderOptionsBlock");
    const riderOptions = document.getElementById("riderOptions");
    const negotiationBlock = document.getElementById("negotiationBlock");
    const negotiationTitle = document.getElementById("negotiationTitle");
    const negotiationMessages = document.getElementById("negotiationMessages");
    const negotiationForm = document.getElementById("negotiationForm");
    const negotiationFare = document.getElementById("negotiationFare");
    const negotiationActions = document.getElementById("negotiationActions");
    const negotiationLauncherBtn = document.getElementById("negotiationLauncherBtn");
    const negotiationMinimizeBtn = document.getElementById("negotiationMinimizeBtn");
    const proposeAgainBtn = document.getElementById("proposeAgainBtn");
    const acceptFinalBtn = document.getElementById("acceptFinalBtn");
    const tripCheckout = document.getElementById("tripCheckout");
    const tripCheckoutSummary = document.getElementById("tripCheckoutSummary");
    const tripSaveCardForm = document.getElementById("tripSaveCardForm");
    const tripCheckoutForm = document.getElementById("tripCheckoutForm");
    const tripPaymentOption = document.getElementById("tripPaymentOption");
    const tripCheckoutMessage = document.getElementById("tripCheckoutMessage");
    const tripPinDisplay = document.getElementById("tripPinDisplay");
    const tripCompleteActions = document.getElementById("tripCompleteActions");
    const completeTripBtn = document.getElementById("completeTripBtn");
    const tripFeedbackBlock = document.getElementById("tripFeedbackBlock");
    const tripFeedbackForm = document.getElementById("tripFeedbackForm");
    const tripTipAmount = document.getElementById("tripTipAmount");
    const tripRating = document.getElementById("tripRating");
    const tripFeedbackMessage = document.getElementById("tripFeedbackMessage");
    const tripMapContainer = document.getElementById("tripMap");
    const sourceInput = document.getElementById("source");
    const destinationInput = document.getElementById("destination");
    const sourceSuggestions = document.getElementById("sourceSuggestions");
    const destinationSuggestions = document.getElementById("destinationSuggestions");
    const useLocationBtn = document.getElementById("useLocationBtn");
    let currentRiderId = "";
    let currentRideRequest = null;
    let currentRideRequestId = "";
    let selectedNegotiationDriver = null;
    let selectedNegotiationDriverId = null;
    let negotiatedFare = null;
    let riderRideRequestPollHandle = null;
    let lastSeenRiderOffer = "";
    let lastSeenDriverCounterOffer = "";
    let finalizedTripId = null;
    let finalizedTripPin = null;
    let tripMap = null;
    let riderMarker = null;
    let driverMarker = null;

    let activeRequestId = 0;

    function openNegotiationPanel() {
        negotiationBlock.classList.remove("hidden");
        negotiationLauncherBtn.classList.add("hidden");
    }

    function minimizeNegotiationPanel() {
        negotiationBlock.classList.add("hidden");
        if (negotiationMessages.textContent.trim()) {
            negotiationLauncherBtn.classList.remove("hidden");
        }
    }

    function closeNegotiationPanel() {
        negotiationBlock.classList.add("hidden");
        negotiationLauncherBtn.classList.add("hidden");
        negotiationActions.classList.add("hidden");
    }

    function hideEstimateComparisonPanels() {
        riderOptionsBlock.classList.add("hidden");
        riderOptions.innerHTML = "";
        drivers.innerHTML = "";
    }

    negotiationLauncherBtn.addEventListener("click", openNegotiationPanel);
    negotiationMinimizeBtn.addEventListener("click", minimizeNegotiationPanel);

    riderLoginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = {
            emailOrId: document.getElementById("riderEmail").value.trim(),
            password: document.getElementById("riderPassword").value
        };
        riderLoginMessage.textContent = "Logging in...";
        try {
            const response = await fetch("/api/auth/rider/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const body = await response.text();
            if (!response.ok) {
                riderLoginMessage.textContent = `Login failed: ${body}`;
                return;
            }
            const result = JSON.parse(body);
            currentRiderId = result.riderId || payload.emailOrId;
            syncChatContext("rider", "RIDER", currentRiderId);
            riderLoginMessage.textContent = result.message || "Rider login successful.";
            riderAuthCard.classList.add("hidden");
            riderOnboardingWrap.classList.add("hidden");
            showRiderOnboardingBtn.textContent = "New user? Start onboarding";
            riderActions.classList.remove("hidden");
            riderProfileBtn.classList.remove("hidden");
            riderLogoutBtn.classList.remove("hidden");
            riderProfilePanel.classList.add("hidden");
            riderProfileBtn.textContent = "My Profile";
            riderForm.classList.remove("hidden");
            riderHint.classList.remove("hidden");
            estimate.classList.remove("hidden");
        } catch (error) {
            riderLoginMessage.textContent = `Login request failed: ${error}`;
        }
    });

    async function loadRiderProfile() {
        const response = await fetch(`/api/riders/profile?riderId=${encodeURIComponent(currentRiderId)}`);
        const body = await response.text();
        if (!response.ok) {
            riderProfileMessage.textContent = `Unable to load profile: ${body}`;
            return;
        }

        const data = JSON.parse(body);
        const addresses = data.homeAddresses || [];
        const payments = data.paymentOptions || [];
        riderAddressList.innerHTML = addresses.map((address) => `<article class="list-item">${address}</article>`).join("");
        riderPaymentList.innerHTML = payments.map((payment) => `
            <article class="list-item">
                <strong>${payment.type}</strong><br>
                ${payment.details}
            </article>
        `).join("");
        await loadRiderSavedCards();
    }

    async function loadRiderSavedCards() {
        if (!currentRiderId) {
            riderSavedCardsList.innerHTML = "";
            return;
        }
        const response = await fetch(`/api/riders/cards?riderId=${encodeURIComponent(currentRiderId)}`);
        const body = await response.text();
        if (!response.ok) {
            riderSavedCardsList.innerHTML = `<article class="list-item">Unable to load cards: ${body}</article>`;
            return;
        }
        const data = JSON.parse(body);
        const cards = data.savedCards || [];
        riderSavedCardsList.innerHTML = cards.length
            ? cards.map((card) => `
                <article class="list-item">
                    <strong>${card.cardHolderName}</strong><br>
                    Card ****${card.last4}<br>
                    Expires ${String(card.expiryMonth).padStart(2, "0")}/${card.expiryYear}<br>
                    <button class="secondary rider-card-delete-btn" data-card-id="${card.cardId}" style="margin-top:8px;">Delete</button>
                </article>
            `).join("")
            : `<article class="list-item">No saved cards yet.</article>`;
        populateTripPaymentOptions(cards);
        document.querySelectorAll(".rider-card-delete-btn").forEach((btn) => {
            btn.addEventListener("click", async () => {
                if (!currentRiderId) {
                    return;
                }
                const cardId = btn.getAttribute("data-card-id");
                riderProfileMessage.textContent = "Deleting card...";
                try {
                    const response = await fetch("/api/riders/cards/delete", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ riderId: currentRiderId, cardId })
                    });
                    const bodyText = await response.text();
                    if (!response.ok) {
                        riderProfileMessage.textContent = `Delete card failed: ${bodyText}`;
                        return;
                    }
                    const result = JSON.parse(bodyText);
                    riderProfileMessage.textContent = result.message || "Card deleted successfully";
                    await loadRiderSavedCards();
                } catch (error) {
                    riderProfileMessage.textContent = `Delete card request failed: ${error}`;
                }
            });
        });
    }

    function populateTripPaymentOptions(cards) {
        const options = ['<option value="">Select payment option</option>'];
        cards.forEach((card) => {
            options.push(`<option value="CARD-****${card.last4}">Card ****${card.last4} (${String(card.expiryMonth).padStart(2, "0")}/${card.expiryYear})</option>`);
        });
        options.push('<option value="Cash">Cash</option>');
        tripPaymentOption.innerHTML = options.join("");
    }

    riderProfileBtn.addEventListener("click", async () => {
        riderProfilePanel.classList.toggle("hidden");
        riderProfileBtn.textContent = riderProfilePanel.classList.contains("hidden") ? "My Profile" : "Hide Profile";
        if (!riderProfilePanel.classList.contains("hidden") && currentRiderId) {
            await loadRiderProfile();
        }
    });

    riderLogoutBtn.addEventListener("click", async () => {
        if (currentRiderId) {
            try {
                await fetch("/api/auth/rider/logout", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: currentRiderId })
                });
            } catch (_) {
            }
        }

        currentRiderId = "";
        syncChatContext("rider", "", "");
        riderAuthCard.classList.remove("hidden");
        riderActions.classList.add("hidden");
        riderOnboardingWrap.classList.add("hidden");
        riderOnboardingForm.reset();
        riderOnboardingMessage.textContent = "Fill rider details to create account.";
        showRiderOnboardingBtn.textContent = "New user? Start onboarding";
        riderProfileBtn.classList.add("hidden");
        riderLogoutBtn.classList.add("hidden");
        riderProfilePanel.classList.add("hidden");
        riderProfileBtn.textContent = "My Profile";
        riderAddressList.innerHTML = "";
        riderPaymentList.innerHTML = "";
        riderSavedCardsList.innerHTML = "";
        riderAddressForm.reset();
        riderPaymentForm.reset();
        riderCardForm.reset();
        tripSaveCardForm.reset();
        riderForm.classList.add("hidden");
        riderHint.classList.add("hidden");
        estimate.classList.add("hidden");
        riderOptionsBlock.classList.add("hidden");
        negotiationBlock.classList.add("hidden");
        negotiationLauncherBtn.classList.add("hidden");
        negotiationActions.classList.add("hidden");
        negotiationMessages.innerHTML = "";
        negotiationFare.value = "";
        stopRiderRideRequestPolling();
        currentRideRequest = null;
        currentRideRequestId = "";
        selectedNegotiationDriver = null;
        selectedNegotiationDriverId = null;
        negotiatedFare = null;
        lastSeenRiderOffer = "";
        lastSeenDriverCounterOffer = "";
        riderOptions.innerHTML = "";
        resetTripCheckout();
        riderLoginForm.reset();
        drivers.innerHTML = "";
        riderLoginMessage.textContent = "Please login to request rides.";
        riderProfileMessage.textContent = "Manage rider addresses and payment options here.";
    });

    showRiderOnboardingBtn.addEventListener("click", () => {
        riderOnboardingWrap.classList.toggle("hidden");
        showRiderOnboardingBtn.textContent = riderOnboardingWrap.classList.contains("hidden")
            ? "New user? Start onboarding"
            : "Hide onboarding";
    });

    riderOnboardingForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {
            firstName: document.getElementById("riderFirstName").value.trim(),
            lastName: document.getElementById("riderLastName").value.trim(),
            email: document.getElementById("riderOnboardingEmail").value.trim(),
            phoneNumber: document.getElementById("riderPhoneNumber").value.trim(),
            password: document.getElementById("riderOnboardingPassword").value,
            confirmPassword: document.getElementById("riderConfirmPassword").value
        };

        riderOnboardingMessage.textContent = "Submitting rider onboarding details...";
        try {
            const response = await fetch("/api/riders/onboard", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const body = await response.text();
            if (!response.ok) {
                riderOnboardingMessage.textContent = `Error ${response.status}: ${body}`;
                return;
            }
            const result = JSON.parse(body);
            riderOnboardingMessage.textContent = result.status || "Rider onboarding completed";
        } catch (error) {
            riderOnboardingMessage.textContent = `Request failed: ${error}`;
        }
    });

    function hideSuggestions(listEl) {
        listEl.classList.add("hidden");
        listEl.innerHTML = "";
    }

    function renderSuggestions(listEl, inputEl, items) {
        if (!items.length) {
            hideSuggestions(listEl);
            return;
        }

        listEl.innerHTML = items.map(item => `<li>${item.display_name}</li>`).join("");
        listEl.classList.remove("hidden");
        [...listEl.querySelectorAll("li")].forEach((node, idx) => {
            node.addEventListener("click", () => {
                inputEl.value = items[idx].display_name;
                hideSuggestions(listEl);
            });
        });
    }

    async function searchAddresses(query, listEl, inputEl) {
        if (!query || query.length < 3) {
            hideSuggestions(listEl);
            return;
        }

        const requestId = ++activeRequestId;
        try {
            const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&q=${encodeURIComponent(query)}`;
            const response = await fetch(url, {
                headers: { "Accept": "application/json" }
            });
            if (!response.ok) {
                hideSuggestions(listEl);
                return;
            }
            const data = await response.json();
            if (requestId !== activeRequestId) {
                return;
            }
            renderSuggestions(listEl, inputEl, data);
        } catch (_) {
            hideSuggestions(listEl);
        }
    }

    function debounce(fn, waitMs) {
        let timer = null;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => fn(...args), waitMs);
        };
    }

    function resetTripCheckout() {
        tripCheckout.classList.add("hidden");
        tripCheckoutSummary.textContent = "";
        tripCheckoutMessage.textContent = "";
        tripPinDisplay.textContent = "";
        tripCompleteActions.classList.add("hidden");
        tripFeedbackBlock.classList.add("hidden");
        tripFeedbackMessage.textContent = "";
        finalizedTripId = null;
        finalizedTripPin = null;
        tripPaymentOption.value = "";
        tripTipAmount.value = "";
        tripRating.value = "";
        if (tripMap) {
            tripMap.remove();
            tripMap = null;
            riderMarker = null;
            driverMarker = null;
        }
    }

    function renderTripMap(riderLocation, driverLocation) {
        if (!tripMap) {
            tripMap = L.map("tripMap");
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }).addTo(tripMap);
        }

        const riderLatLng = [riderLocation.lat, riderLocation.lng];
        const driverLatLng = [driverLocation.lat, driverLocation.lng];

        if (riderMarker) {
            riderMarker.setLatLng(riderLatLng);
        } else {
            riderMarker = L.marker(riderLatLng).addTo(tripMap).bindPopup("Your Location");
        }
        if (driverMarker) {
            driverMarker.setLatLng(driverLatLng);
        } else {
            driverMarker = L.marker(driverLatLng).addTo(tripMap).bindPopup("Driver Location");
        }

        const bounds = L.latLngBounds([riderLatLng, driverLatLng]);
        tripMap.fitBounds(bounds.pad(0.3));
        setTimeout(() => tripMap.invalidateSize(), 50);
    }

    function roundCurrency(value) {
        return Math.round(value * 100) / 100;
    }

    function deriveRideOptions(estimateData) {
        const baseFare = Number(estimateData.estimatedFare || 0);
        const baseEta = Number(estimateData.estimatedTimeMinutes || 0);
        return [
            {
                provider: "Uber",
                car: "UberX - Toyota Corolla",
                driver: "Daniel K.",
                etaMinutes: Math.max(2, baseEta - 2),
                fare: roundCurrency(baseFare + 1.8)
            },
            {
                provider: "Uber",
                car: "Uber Comfort - Honda Accord",
                driver: "Mia T.",
                etaMinutes: Math.max(3, baseEta - 1),
                fare: roundCurrency(baseFare + 3.2)
            },
            {
                provider: "Lyft",
                car: "Lyft Standard - Nissan Altima",
                driver: "Sophia M.",
                etaMinutes: Math.max(2, baseEta - 2),
                fare: roundCurrency(baseFare + 1.2)
            },
            {
                provider: "Lyft",
                car: "Lyft XL - Toyota Highlander",
                driver: "Chris P.",
                etaMinutes: Math.max(4, baseEta),
                fare: roundCurrency(baseFare + 4.1)
            }
        ];
    }

    const debouncedSourceSearch = debounce(() => searchAddresses(sourceInput.value.trim(), sourceSuggestions, sourceInput), 300);
    const debouncedDestinationSearch = debounce(() => searchAddresses(destinationInput.value.trim(), destinationSuggestions, destinationInput), 300);

    sourceInput.addEventListener("input", debouncedSourceSearch);
    destinationInput.addEventListener("input", debouncedDestinationSearch);

    document.addEventListener("click", (event) => {
        if (!sourceSuggestions.contains(event.target) && event.target !== sourceInput) {
            hideSuggestions(sourceSuggestions);
        }
        if (!destinationSuggestions.contains(event.target) && event.target !== destinationInput) {
            hideSuggestions(destinationSuggestions);
        }
    });

    useLocationBtn.addEventListener("click", () => {
        if (!navigator.geolocation) {
            estimate.textContent = "Geolocation is not supported by this browser.";
            return;
        }

        useLocationBtn.disabled = true;
        useLocationBtn.textContent = "Locating...";
        navigator.geolocation.getCurrentPosition(async (position) => {
            try {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
                const resp = await fetch(url, { headers: { "Accept": "application/json" } });
                const data = await resp.json();
                sourceInput.value = data.display_name || `${lat}, ${lon}`;
            } catch (_) {
                estimate.textContent = "Unable to resolve your current address.";
            } finally {
                useLocationBtn.disabled = false;
                useLocationBtn.textContent = "Use My Location";
            }
        }, () => {
            estimate.textContent = "Location access denied or unavailable.";
            useLocationBtn.disabled = false;
            useLocationBtn.textContent = "Use My Location";
        });
    });

    function resetEstimateFlow(payload) {
        riderForm.classList.remove("hidden");
        riderHint.classList.remove("hidden");
        estimate.classList.remove("hidden");
        estimate.textContent = "Fetching estimate...";
        drivers.innerHTML = "";
        riderOptionsBlock.classList.add("hidden");
        riderOptions.innerHTML = "";
        negotiationBlock.classList.add("hidden");
        negotiationLauncherBtn.classList.add("hidden");
        negotiationActions.classList.add("hidden");
        negotiationMessages.innerHTML = "";
        negotiationFare.value = "";
        selectedNegotiationDriver = null;
        selectedNegotiationDriverId = null;
        negotiatedFare = null;
        stopRiderRideRequestPolling();
        currentRideRequestId = "";
        lastSeenRiderOffer = "";
        lastSeenDriverCounterOffer = "";
        currentRideRequest = payload;
        resetTripCheckout();
    }

    async function shareRideRequestWithDrivers(payload, data) {
        if (!currentRiderId) {
            return;
        }
        try {
            const rideRequestResponse = await fetch("/api/rides/requests", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    riderId: currentRiderId,
                    source: payload.source,
                    destination: payload.destination,
                    departureTime: payload.departureTime,
                    estimatedFare: data.estimatedFare,
                    currency: data.currency
                })
            });
            const rideRequestBody = await rideRequestResponse.text();
            if (rideRequestResponse.ok) {
                const rideRequest = JSON.parse(rideRequestBody);
                currentRideRequestId = rideRequest.requestId || "";
                lastSeenRiderOffer = "";
                lastSeenDriverCounterOffer = "";
                riderHint.textContent = rideRequest.message || "Ride request shared with nearby drivers.";
                startRiderRideRequestPolling();
            } else {
                riderHint.textContent = `Ride request was not shared with drivers: ${rideRequestBody}`;
            }
        } catch (error) {
            riderHint.textContent = `Ride request dispatch failed: ${error}`;
        }
    }

    async function renderRideEstimate(data, options) {
        const shouldShareRideRequest = !options || options.shareRideRequest !== false;
        const payload = {
            source: data.source || "",
            destination: data.destination || "",
            departureTime: data.departureTime || document.getElementById("departureTime").value
        };
        sourceInput.value = payload.source;
        destinationInput.value = payload.destination;
        if (payload.departureTime) {
            document.getElementById("departureTime").value = payload.departureTime;
        }
        currentRideRequest = payload;

        estimate.innerHTML = `
            <strong>Trip:</strong> ${data.source} -> ${data.destination}<br>
            <strong>Departure:</strong> ${data.departureTime}<br>
            <strong>ETA:</strong> ${data.estimatedTimeMinutes} mins<br>
            <strong>Estimated Fare:</strong> ${data.currency} ${data.estimatedFare}
        `;
        const rideOptions = deriveRideOptions(data);
        riderOptionsBlock.classList.remove("hidden");
        riderOptions.innerHTML = rideOptions.map((option) => `
            <article class="option-card">
                <strong>${option.provider}</strong><br>
                Car: ${option.car}<br>
                Driver: ${option.driver}<br>
                ETA: ${option.etaMinutes} mins<br>
                Fare: ${data.currency} ${option.fare}
            </article>
        `).join("");

        if (shouldShareRideRequest) {
            await shareRideRequestWithDrivers(payload, data);
        }

        drivers.innerHTML = (data.availableDrivers || []).map(driver => `
            <article class="driver-card">
                <strong>${driver.name}</strong>
                <div>${driver.vehicle}</div>
                <div>Arrives in ${driver.etaMinutes} mins</div>
                <div>Rating ${driver.rating}</div>
                <button class="secondary negotiate-btn" data-driver-id="${driver.driverId}" data-driver="${driver.name}" style="margin-top:8px;">Negotiate Fare</button>
            </article>
        `).join("");

        document.querySelectorAll(".negotiate-btn").forEach((btn) => {

    async function loadRiderRideRequestStatus() {
        if (!currentRideRequestId || !currentRiderId) {
            return null;
        }

        try {
            const response = await fetch(`/api/rides/requests/status?requestId=${encodeURIComponent(currentRideRequestId)}&riderId=${encodeURIComponent(currentRiderId)}`);
            const body = await response.text();
            if (response.status === 410) {
                const result = JSON.parse(body);
                stopRiderRideRequestPolling();
                currentRideRequestId = "";
                riderHint.textContent = result.message || "No drivers are available right now. Please try again.";
                negotiationBlock.classList.add("hidden");
                negotiationLauncherBtn.classList.add("hidden");
                negotiationActions.classList.add("hidden");
                return null;
            }
            if (!response.ok) {
                return null;
            }

            const request = JSON.parse(body);
            const riderOffer = request.riderOffer === "" || request.riderOffer == null
                ? null
                : Number(request.riderOffer);
            const counterOffer = request.counterOffer === "" || request.counterOffer == null
                ? null
                : Number(request.counterOffer);
            const riderOfferKey = riderOffer == null ? "" : riderOffer.toFixed(2);
            const counterOfferKey = counterOffer == null ? "" : counterOffer.toFixed(2);

            if (request.status === "ACCEPTED_BY_DRIVER" && request.driverName) {
                riderHint.textContent = `${request.driverName} accepted your ride request. Waiting for the latest counter offer.`;
            }

            if (riderOffer != null && riderOfferKey !== lastSeenRiderOffer) {
                lastSeenRiderOffer = riderOfferKey;
                negotiationMessages.innerHTML += `<div class="chat-msg"><strong>You:</strong> I can pay USD ${riderOffer.toFixed(2)}.</div>`;
                negotiationMessages.scrollTop = negotiationMessages.scrollHeight;
            }

            if (counterOffer != null && counterOfferKey !== lastSeenDriverCounterOffer) {
                selectedNegotiationDriver = request.driverName || selectedNegotiationDriver || "Driver";
                selectedNegotiationDriverId = request.assignedDriverId || selectedNegotiationDriverId;
                negotiatedFare = counterOffer;
                lastSeenDriverCounterOffer = counterOfferKey;
                negotiationTitle.textContent = `Negotiate Fare with ${selectedNegotiationDriver}`;
                if (!request.riderFinalAcceptance && !request.driverFinalAcceptance) {
                    openNegotiationPanel();
                }
                negotiationMessages.innerHTML += `<div class="chat-msg"><strong>${selectedNegotiationDriver}:</strong> Sent a counter offer of ${request.currency || "USD"} ${counterOffer.toFixed(2)}.</div>`;
                negotiationMessages.scrollTop = negotiationMessages.scrollHeight;
                acceptFinalBtn.textContent = `Accept Final Price (USD ${negotiatedFare.toFixed(2)})`;
                riderHint.textContent = `${selectedNegotiationDriver} sent a new counter offer.`;
            }
            if (counterOffer != null) {
                selectedNegotiationDriver = request.driverName || selectedNegotiationDriver || "Driver";
                selectedNegotiationDriverId = request.assignedDriverId || selectedNegotiationDriverId;
                negotiatedFare = counterOffer;
                negotiationTitle.textContent = `Negotiate Fare with ${selectedNegotiationDriver}`;
                acceptFinalBtn.textContent = `Accept Final Price (USD ${negotiatedFare.toFixed(2)})`;
                if (!request.riderFinalAcceptance && !request.driverFinalAcceptance) {
                    negotiationBlock.classList.remove("hidden");
                    negotiationLauncherBtn.classList.add("hidden");
                    negotiationActions.classList.remove("hidden");
                    riderHint.textContent = `${selectedNegotiationDriver} sent a counter offer. You can accept it or propose again.`;
                } else {
                    closeNegotiationPanel();
                }
            } else {
                negotiationActions.classList.add("hidden");
            }
            if (request.riderFinalAcceptance && !request.driverFinalAcceptance) {
                closeNegotiationPanel();
                riderHint.textContent = "You accepted the final fare. Waiting for driver acceptance.";
            }
            if (request.riderFinalAcceptance && request.driverFinalAcceptance && counterOffer != null) {
                closeNegotiationPanel();
                hideEstimateComparisonPanels();
                negotiatedFare = counterOffer;
                selectedNegotiationDriver = request.driverName || selectedNegotiationDriver || "Driver";
                selectedNegotiationDriverId = request.assignedDriverId || selectedNegotiationDriverId;
                tripCheckout.classList.remove("hidden");
                tripCheckoutSummary.textContent = `Driver: ${selectedNegotiationDriver} | Final Fare: USD ${negotiatedFare.toFixed(2)}`;
                tripCheckoutMessage.textContent = "Both rider and driver accepted the final fare. Choose payment option and finalize trip.";
                riderHint.textContent = "Both rider and driver accepted the final fare.";
                await loadRiderSavedCards();
            }
            return request;
        } catch (_) {
            return null;
        }
    }

        const payload = {
            emailOrId: document.getElementById("driverLoginId").value.trim(),
            password: document.getElementById("driverLoginPassword").value
        };
        driverLoginMessage.textContent = "Logging in...";
        try {
            const response = await fetch("/api/auth/driver/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const body = await response.text();
            if (!response.ok) {
                driverLoginMessage.textContent = `Login failed: ${body}`;
                return;
            }
            const result = JSON.parse(body);
            currentDriverId = result.driverId || payload.emailOrId;
            syncChatContext("rider", "DRIVER", currentDriverId);
            driverLoginMessage.textContent = result.message || "Driver login successful.";
            const onboardingRequired = !!result.onboardingRequired;
            driverOnboardingWrap.classList.toggle("hidden", !onboardingRequired);
            showOnboardingBtn.textContent = onboardingRequired ? "Hide onboarding" : "New user? Start onboarding";
            driverAuthCard.classList.add("hidden");
            driverDashboard.classList.remove("hidden");
            driverLogoutBtn.classList.remove("hidden");

            const ridesResponse = await fetch(`/api/drivers/rides?driverId=${encodeURIComponent(currentDriverId)}`);
            const ridesBody = await ridesResponse.text();
            if (!ridesResponse.ok) {
                driverRides.innerHTML = `<div class="ride-item">Unable to load rides: ${ridesBody}</div>`;
                return;
            }
            const ridesData = JSON.parse(ridesBody);
            const rides = ridesData.rides || [];
            driverRides.innerHTML = rides.map((ride) => `
                <article class="ride-item">
                    <strong>${ride.rideId}</strong><br>
                    ${ride.source} -> ${ride.destination}<br>
                    Fare: USD ${ride.fare}<br>
                    Date: ${ride.date}
                </article>
            `).join("");

            const ratingsResponse = await fetch(`/api/drivers/ratings?driverId=${encodeURIComponent(currentDriverId)}`);
            const ratingsBody = await ratingsResponse.text();
            if (!ratingsResponse.ok) {
                driverOverallRating.textContent = `Unable to load ratings: ${ratingsBody}`;
            } else {
                const ratingsData = JSON.parse(ratingsBody);
                driverOverallRating.textContent = `Overall Rating: ${ratingsData.overallRating} (${ratingsData.totalTripsRated} rated trips)`;
                const strengths = ratingsData.strengths || [];
                driverStrengths.innerHTML = strengths.map((item) => `
                    <article class="strength-item">
                        <strong>${item.name}</strong><br>
                        Score: ${item.score}
                    </article>
                `).join("");
            }
            await loadDriverCars();
            await loadDriverRideRequests();
            startDriverRideRequestPolling();
        } catch (error) {
            driverLoginMessage.textContent = `Login request failed: ${error}`;
        }
        });
    }

    if (driverLogoutBtn) {
        driverLogoutBtn.addEventListener("click", async () => {
        if (currentDriverId) {
            try {
                await fetch("/api/auth/driver/logout", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: currentDriverId })
                });
            } catch (_) {
            }
        }

        currentDriverId = "";
        stopDriverRideRequestPolling();
        activeDriverRideRequestId = "";
        syncChatContext("rider", "", "");
        driverAuthCard.classList.remove("hidden");
        driverDashboard.classList.add("hidden");
        driverLogoutBtn.classList.add("hidden");
        driverOnboardingWrap.classList.add("hidden");
        driverRides.innerHTML = "";
        driverOverallRating.textContent = "";
        driverStrengths.innerHTML = "";
        driverCars.innerHTML = "";
        driverRideRequests.innerHTML = "";
        driverRideRequestsMessage.textContent = "Nearby rider requests will appear here after login.";
        driverAcceptedRideBlock.classList.add("hidden");
        driverNegotiationLauncherBtn.classList.add("hidden");
        hideDriverStartRidePrompt();
        driverClosedStartPromptRequestId = "";
        driverStartedRideRequestId = "";
        driverNegotiationTitle.textContent = "Accepted Ride";
        driverAcceptedRideSummary.textContent = "";
        driverNegotiationMessages.innerHTML = "";
        driverNegotiationActions.classList.add("hidden");
        driverRideNegotiationForm.reset();
        driverRideNegotiationMessage.textContent = "Accept a ride request to start negotiating with the rider.";
        driverCarForm.reset();
        driverContactForm.reset();
        driverForm.reset();
        driverLoginForm.reset();
        driverLoginMessage.textContent = "Already registered? Login to continue.";
        driverContactMessage.textContent = "Contact information can be updated after login.";
        driverCarMessage.textContent = "Existing cars are shown above.";
        driverMessage.textContent = "Fill the form and upload scanned license copy.";
        showOnboardingBtn.textContent = "New user? Start onboarding";
        });
    }

    function renderDriverAcceptedRide(request) {
        if (!request) {
            driverAcceptedRideBlock.classList.add("hidden");
            driverNegotiationLauncherBtn.classList.add("hidden");
            driverNegotiationTitle.textContent = "Accepted Ride";
            driverAcceptedRideSummary.textContent = "";
            driverNegotiationMessages.innerHTML = "";
            driverNegotiationActions.classList.add("hidden");
            driverRideNegotiationMessage.textContent = "Accept a ride request to start negotiating with the rider.";
            hideDriverStartRidePrompt();
            return;
        }

        activeDriverRideRequestId = request.requestId || "";
        if (!request.driverFinalAcceptance) {
            openDriverNegotiationPanel();
        }
        driverNegotiationTitle.textContent = `Negotiate Fare with ${request.riderName || "Rider"}`;
        const summaryLines = [
            `<strong>${request.riderName || "Rider request"}</strong>`,
            `${request.source} -> ${request.destination}`,
            `Departure: ${request.departureTime}`,
            `Estimated Fare: ${request.currency || "USD"} ${request.estimatedFare}`,
            `Status: ${request.status}`,
            `Latest Rider Offer: ${request.riderOffer ? `${request.currency || "USD"} ${Number(request.riderOffer).toFixed(2)}` : "Not sent yet"}`,
            `Latest Counter Offer: ${request.counterOffer ? `${request.currency || "USD"} ${Number(request.counterOffer).toFixed(2)}` : "Not sent yet"}`,
            `Rider Accepted: ${request.riderFinalAcceptance ? "Yes" : "No"}`,
            `Driver Accepted: ${request.driverFinalAcceptance ? "Yes" : "No"}`
        ];
        driverAcceptedRideSummary.innerHTML = summaryLines.join("<br>");

        const messageLines = [
            `<div class="chat-msg"><strong>System:</strong> You accepted this ride request. Send a counter offer to continue the negotiation.</div>`
        ];
        if (request.riderOffer) {
            messageLines.push(`<div class="chat-msg"><strong>${request.riderName || "Rider"}:</strong> I can pay ${(request.currency || "USD")} ${Number(request.riderOffer).toFixed(2)}.</div>`);
        } else {
            messageLines.push(`<div class="chat-msg"><strong>System:</strong> Waiting for the rider's first offer.</div>`);
        }
        if (request.counterOffer) {
            messageLines.push(`<div class="chat-msg"><strong>You:</strong> Latest counter offer is ${request.currency || "USD"} ${Number(request.counterOffer).toFixed(2)}.</div>`);
        }
        if (request.riderFinalAcceptance && request.counterOffer) {
            messageLines.push(`<div class="chat-msg"><strong>System:</strong> Rider accepted your counter offer of ${request.currency || "USD"} ${Number(request.counterOffer).toFixed(2)}. Confirm the final offer to finalize the trip.</div>`);
        }
        driverNegotiationMessages.innerHTML = messageLines.join("");
        if (request.counterOffer && request.riderFinalAcceptance && !request.driverFinalAcceptance) {
            openDriverNegotiationPanel();
            driverNegotiationActions.classList.remove("hidden");
            driverAcceptFinalBtn.textContent = `Confirm Final Offer (${request.currency || "USD"} ${Number(request.counterOffer).toFixed(2)})`;
        } else {
            driverNegotiationActions.classList.add("hidden");
        }
        if (request.driverFinalAcceptance) {
            closeDriverNegotiationPanel();
            driverRideNegotiationMessage.textContent = "You accepted the final fare.";
        }
        if (request.riderFinalAcceptance && request.driverFinalAcceptance) {
            showDriverStartRidePrompt(request);
            driverRideRequestsMessage.textContent = `${request.riderName || "Rider"} accepted the final fare. Start to the pickup location when ready.`;
        } else {
            hideDriverStartRidePrompt();
        }
    }

    function renderDriverRideRequests(requests) {
        const list = Array.isArray(requests) ? requests : [];
        const pendingRequests = list.filter((request) => request.status === "PENDING_DRIVER");
        const activeRequest = list.find((request) =>
            request.assignedDriverId === currentDriverId &&
            (request.status === "ACCEPTED_BY_DRIVER" || request.status === "NEGOTIATING")
        ) || null;

        renderDriverAcceptedRide(activeRequest);

        if (!pendingRequests.length) {
            driverRideRequests.innerHTML = `<article class="ride-item">No open ride requests right now.</article>`;
        } else {
            driverRideRequests.innerHTML = pendingRequests.map((request) => `
                <article class="ride-item">
                    <strong>${request.riderName || "Rider"}</strong><br>
                    ${request.source} -> ${request.destination}<br>
                    Departure: ${request.departureTime}<br>
                    Estimated Fare: ${request.currency || "USD"} ${request.estimatedFare}<br>
                    <button class="secondary driver-ride-request-accept-btn" data-request-id="${request.requestId}" style="margin-top:8px;">Accept Ride</button>
                </article>
            `).join("");
        }

        document.querySelectorAll(".driver-ride-request-accept-btn").forEach((btn) => {
            btn.addEventListener("click", async () => {
                if (!currentDriverId) {
                    return;
                }
                const requestId = btn.getAttribute("data-request-id");
                if (!requestId) {
                    return;
                }
                driverRideRequestsMessage.textContent = "Accepting ride request...";
                try {
                    const response = await fetch("/api/drivers/ride-requests/accept", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ driverId: currentDriverId, requestId })
                    });
                    const body = await response.text();
                    if (!response.ok) {
                        driverRideRequestsMessage.textContent = `Accept ride failed: ${body}`;
                        return;
                    }
                    const result = JSON.parse(body);
                    driverRideRequestsMessage.textContent = result.message || "Ride request accepted.";
                    renderDriverAcceptedRide(result);
                    driverNegotiationMessages.innerHTML = `<div class="chat-msg"><strong>System:</strong> You accepted ${result.riderName || "the rider"}'s request. Start the fare negotiation below.</div>`;
                    await loadDriverRideRequests();
                } catch (error) {
                    driverRideRequestsMessage.textContent = `Accept ride request failed: ${error}`;
                }
            });
        });
    }

    async function loadDriverRideRequests() {
        if (!currentDriverId) {
            return;
        }
        try {
            const response = await fetch(`/api/drivers/ride-requests?driverId=${encodeURIComponent(currentDriverId)}`);
            const body = await response.text();
            if (!response.ok) {
                driverRideRequestsMessage.textContent = `Unable to load ride requests: ${body}`;
                return;
            }
            const data = JSON.parse(body);
            driverRideRequestsMessage.textContent = "Polling for rider requests every 10 seconds.";
            renderDriverRideRequests(data.requests || []);
        } catch (error) {
            driverRideRequestsMessage.textContent = `Ride request polling failed: ${error}`;
        }
    }

    function startDriverRideRequestPolling() {
        stopDriverRideRequestPolling();
        driverRideRequestPollHandle = window.setInterval(() => {
            loadDriverRideRequests();
        }, 10000);
    }

    function stopDriverRideRequestPolling() {
        if (driverRideRequestPollHandle) {
            window.clearInterval(driverRideRequestPollHandle);
            driverRideRequestPollHandle = null;
        }
    }

    async function loadDriverCars() {
        const response = await fetch(`/api/drivers/cars?driverId=${encodeURIComponent(currentDriverId)}`);
        const body = await response.text();
        if (!response.ok) {
            driverCars.innerHTML = `<div class="car-item">Unable to load cars: ${body}</div>`;
            return;
        }
        const data = JSON.parse(body);
        const cars = data.cars || [];
        driverCars.innerHTML = cars.map((car) => `
            <article class="car-item">
                <strong>${car.model}</strong><br>
                Plate: ${car.plateNumber}<br>
                Color: ${car.color}<br>
                <button class="secondary driver-car-delete-btn" data-car-id="${car.carId}" style="margin-top:8px;">Delete</button>
            </article>
        `).join("");
        document.querySelectorAll(".driver-car-delete-btn").forEach((btn) => {
            btn.addEventListener("click", async () => {
                if (!currentDriverId) {
                    return;
                }
                const carId = Number(btn.getAttribute("data-car-id"));
                if (!carId) {
                    return;
                }
                driverCarMessage.textContent = "Deleting car...";
                try {
                    const response = await fetch("/api/drivers/cars/delete", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ driverId: currentDriverId, carId })
                    });
                    const bodyText = await response.text();
                    if (!response.ok) {
                        driverCarMessage.textContent = `Delete car failed: ${bodyText}`;
                        return;
                    }
                    const result = JSON.parse(bodyText);
                    driverCarMessage.textContent = result.message || "Car deleted successfully";
                    await loadDriverCars();
                } catch (error) {
                    driverCarMessage.textContent = `Delete car request failed: ${error}`;
                }
            });
        });
    }

    if (showOnboardingBtn) {
        showOnboardingBtn.addEventListener("click", () => {
            driverOnboardingWrap.classList.toggle("hidden");
            showOnboardingBtn.textContent = driverOnboardingWrap.classList.contains("hidden")
                ? "New user? Start onboarding"
                : "Hide onboarding";
        });
    }

    if (driverForm) {
        driverForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const documentInput = document.getElementById("driverLicenseDocument");
        if (!documentInput.files || documentInput.files.length === 0) {
            driverMessage.textContent = "Please upload scanned copy of license.";
            return;
        }

        const data = new FormData();
        data.append("name", document.getElementById("driverName").value.trim());
        data.append("age", document.getElementById("driverAge").value.trim());
        data.append("sex", document.getElementById("driverSex").value.trim());
        data.append("socialAddress", document.getElementById("driverSocialAddress").value.trim());
        data.append("experience", document.getElementById("driverExperience").value.trim());
        data.append("email", document.getElementById("driverEmail").value.trim());
        data.append("phoneNumber", document.getElementById("driverPhoneNumber").value.trim());
        data.append("password", document.getElementById("driverPassword").value);
        data.append("confirmPassword", document.getElementById("driverConfirmPassword").value);
        data.append("drivingLicenseNumber", document.getElementById("driverLicenseNumber").value.trim());
        data.append("licenseDocument", documentInput.files[0]);

        driverMessage.textContent = "Submitting onboarding details...";

        try {
            const response = await fetch("/api/drivers/onboard", {
                method: "POST",
                body: data
            });
            const body = await response.text();
            if (!response.ok) {
                driverMessage.textContent = `Error ${response.status}: ${body}`;
                return;
            }
            const result = JSON.parse(body);
            driverMessage.textContent = result.status || "Driver is Onboarded and clearance pending will be send via mail";
        } catch (error) {
            driverMessage.textContent = `Request failed: ${error}`;
        }
        });
    }

    if (driverContactForm) {
        driverContactForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!currentDriverId) {
            driverContactMessage.textContent = "Please login as driver first.";
            return;
        }

        const payload = {
            driverId: currentDriverId,
            phone: document.getElementById("driverContactPhone").value.trim(),
            email: document.getElementById("driverContactEmail").value.trim(),
            address: document.getElementById("driverContactAddress").value.trim()
        };

        driverContactMessage.textContent = "Updating contact information...";
        try {
            const response = await fetch("/api/drivers/contact/update", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const body = await response.text();
            if (!response.ok) {
                driverContactMessage.textContent = `Update failed: ${body}`;
                return;
            }
            const result = JSON.parse(body);
            driverContactMessage.textContent = result.message || "Contact information updated successfully";
        } catch (error) {
            driverContactMessage.textContent = `Update request failed: ${error}`;
        }
        });
    }

    if (driverCarForm) {
        driverCarForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!currentDriverId) {
            driverCarMessage.textContent = "Please login as driver first.";
            return;
        }

        const payload = {
            driverId: currentDriverId,
            model: document.getElementById("carModel").value.trim(),
            plateNumber: document.getElementById("carPlateNumber").value.trim(),
            color: document.getElementById("carColor").value.trim()
        };

        driverCarMessage.textContent = "Adding car...";
        try {
            const response = await fetch("/api/drivers/cars", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const body = await response.text();
            if (!response.ok) {
                driverCarMessage.textContent = `Add car failed: ${body}`;
                return;
            }

            const result = JSON.parse(body);
            driverCarMessage.textContent = result.message || "Car added successfully";
            await loadDriverCars();
            driverCarForm.reset();
        } catch (error) {
            driverCarMessage.textContent = `Add car request failed: ${error}`;
        }
        });
    }

    if (driverRideNegotiationForm) {
        driverRideNegotiationForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!currentDriverId || !activeDriverRideRequestId) {
            driverRideNegotiationMessage.textContent = "Accept a ride request before sending a counter offer.";
            return;
        }

        const counterOffer = Number(driverRideCounterOffer.value);
        if (!counterOffer || counterOffer <= 0) {
            driverRideNegotiationMessage.textContent = "Enter a valid counter offer.";
            return;
        }

        driverNegotiationMessages.innerHTML += `<div class="chat-msg"><strong>You:</strong> I can do ${counterOffer.toFixed(2)} USD for this trip.</div>`;
        driverNegotiationMessages.scrollTop = driverNegotiationMessages.scrollHeight;
        driverRideNegotiationMessage.textContent = "Sending counter offer...";
        try {
            const response = await fetch("/api/drivers/ride-requests/negotiate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    driverId: currentDriverId,
                    requestId: activeDriverRideRequestId,
                    counterOffer
                })
            });
            const body = await response.text();
            if (!response.ok) {
                driverRideNegotiationMessage.textContent = `Counter offer failed: ${body}`;
                return;
            }
            const result = JSON.parse(body);
            driverRideNegotiationMessage.textContent = result.message || "Counter offer saved.";
            driverNegotiationMessages.innerHTML += `<div class="chat-msg"><strong>System:</strong> Counter offer sent to the rider at ${(result.currency || "USD")} ${Number(result.counterOffer).toFixed(2)}.</div>`;
            driverNegotiationMessages.scrollTop = driverNegotiationMessages.scrollHeight;
            driverRideCounterOffer.value = "";
            await loadDriverRideRequests();
        } catch (error) {
            driverRideNegotiationMessage.textContent = `Counter offer request failed: ${error}`;
        }
        });
    }

    if (driverAcceptFinalBtn) {
        driverAcceptFinalBtn.addEventListener("click", async () => {
        if (!currentDriverId || !activeDriverRideRequestId) {
            driverRideNegotiationMessage.textContent = "Accept a ride request before accepting the final fare.";
            return;
        }

        driverRideNegotiationMessage.textContent = "Accepting rider offer...";
        try {
            const response = await fetch("/api/drivers/ride-requests/accept-final", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    driverId: currentDriverId,
                    requestId: activeDriverRideRequestId
                })
            });
            const body = await response.text();
            if (!response.ok) {
                driverRideNegotiationMessage.textContent = `Accept final fare failed: ${body}`;
                return;
            }
            const result = JSON.parse(body);
            driverRideNegotiationMessage.textContent = result.message || "Driver accepted the final fare.";
            driverNegotiationMessages.innerHTML += `<div class="chat-msg"><strong>System:</strong> You accepted the rider's final fare.</div>`;
            driverNegotiationMessages.scrollTop = driverNegotiationMessages.scrollHeight;
            closeDriverNegotiationPanel();
            await loadDriverRideRequests();
        } catch (error) {
            driverRideNegotiationMessage.textContent = `Accept final fare request failed: ${error}`;
        }
        });
    }

    if (driverStartRideBtn) {
        driverStartRideBtn.addEventListener("click", () => {
            if (!activeDriverRideRequestId) {
                hideDriverStartRidePrompt();
                return;
            }
            driverStartedRideRequestId = activeDriverRideRequestId;
            hideDriverStartRidePrompt();
            driverRideRequestsMessage.textContent = "Ride started. Head to the rider pickup location.";
        });
    }

    if (driverDismissStartRideBtn) {
        driverDismissStartRideBtn.addEventListener("click", () => {
            driverClosedStartPromptRequestId = activeDriverRideRequestId;
            hideDriverStartRidePrompt();
            driverRideRequestsMessage.textContent = "Start ride prompt dismissed. The accepted ride remains active.";
        });
    }
</script>
</body>
</html>
