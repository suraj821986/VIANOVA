<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vianova</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app-root"></div>
<div id="chatbot-root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="/js/modules/shared-components.js"></script>
<script src="/js/modules/chatbot-components.js"></script>
<script src="/js/modules/rider-components.js"></script>
<script src="/js/modules/driver-components.js"></script>
<script src="/js/modules/app-shell.js"></script>
<script src="/js/react-shell.js"></script>
<script>
    window.VianovaChatContext = {
        page: "home",
        userType: "",
        userId: ""
    };
    try {
        window.sessionStorage.setItem("vianova-chat-context", JSON.stringify(window.VianovaChatContext));
    } catch (_) {
    }
    window.VianovaReactShell.mount("home");
    window.VianovaUiModules.chatbot.mount();
</script>
</body>
</html>
